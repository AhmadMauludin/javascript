<html>
  <head>
    <title>Praktikum JavaScript</title>
  </head>
  <body>
    <h1>Praktikum JavaScript</h1>
    <h3>Variabel, Tipe Data</h3>

    <script>
      document.write("<h2>1. Variabel</h2>");
      var nama = "Andi";
      let umur = 17;
      const jurusan = "RPL";

      document.write("Nama (var): " + nama + "<br>");
      document.write("Umur (let): " + umur + "<br>");
      document.write("Jurusan (const): " + jurusan + "<br><br>");

      document.write("<h2>2. Tipe Data</h2>");
      let teks = "Halo"; // String
      let angka = 123; // Number
      let benar = true; // Boolean
      let kosong = null; // Null
      let belum; // Undefined
      let hobi = ["Coding", "Gaming"]; // Array
      let siswa = { nama: "Budi", kelas: "10 RPL" }; // Object

      document.write("String: " + teks + "<br>");
      document.write("Number: " + angka + "<br>");
      document.write("Boolean: " + benar + "<br>");
      document.write("Null: " + kosong + "<br>");
      document.write("Undefined: " + belum + "<br>");
      document.write("Array: " + hobi + "<br>");
      document.write("Object: " + siswa.nama + ", " + siswa.kelas + "<br><br>");
    </script>
  </body>
</html>
